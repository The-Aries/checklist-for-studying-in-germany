<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="面向中国大陆普通高校本科毕业生的德国硕士留学清单，覆盖 APS、签证、City Registration 与 Residence Permit，附官方来源、本地进度与打印功能。">
  <title>德国留学清单 · Checklist for studying in Germany</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/print.css" media="print">
  <script src="assets/js/app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至清单内容</a>
  <div class="page">
    <header>
      <p class="eyebrow">德国硕士留学 · 申请清单</p>
      <h1 data-testid="app-title">Checklist for studying in Germany</h1>
      <p class="audience">适用于中国大陆普通高校本科应届及往届毕业生，计划赴德国攻读硕士。</p>
      <div class="summary">
        <div><p data-testid="overall-progress" aria-live="polite">总进度加载中</p><progress id="overall-bar" max="100" value="0" aria-label="总进度"></progress></div>
        <p data-testid="stage-progress" aria-live="polite"></p>
        <div class="dates"><span data-testid="last-updated"></span><span data-testid="last-verified"></span></div>
      </div>
      <nav aria-label="办理阶段"><a href="#aps" data-route="aps">APS 审核 <span class="nav-count"></span></a><a href="#visa" data-route="visa">签证 <span class="nav-count"></span></a><a href="#city-registration" data-route="city-registration">City Registration <span class="nav-count"></span></a><a href="#residence-permit" data-route="residence-permit">Residence Permit <span class="nav-count"></span></a><a href="#faq" data-route="faq">常见问题</a></nav>
    </header>
    <main id="main" tabindex="-1">
      <div class="actions"><button type="button" data-action="print-current">打印当前进度</button><button type="button" data-action="print-blank">打印空白 Checklist</button><button type="button" data-action="reset">重置 Checklist</button></div>
      <p id="storage-notice" role="status" hidden></p>
      <div id="content"><p role="status">正在加载清单。如果加载失败，请刷新页面。</p></div>
      <noscript><p>请启用 JavaScript 以使用清单和本地保存功能。也可直接查阅 <a href="docs/CONTENT_APS_VISA.md">APS / 签证内容</a>、<a href="docs/CONTENT_ARRIVAL.md">入境后内容</a>与<a href="docs/SOURCES.md">官方来源</a>。</p></noscript>
    </main>
    <footer data-testid="footer"><div id="footer-links"></div><p class="privacy">进度仅保存在当前浏览器，不跨设备同步。清除网站数据可能丢失进度。本站无账号、广告或自定义追踪 Cookie，未启用访问统计。请勿在公开讨论中提交个人证件或申请材料。</p></footer>
  </div>
</body>
</html>
